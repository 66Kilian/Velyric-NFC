name: velyric-nfc

services:
  web:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8088:80'
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./index.html
        target: /usr/share/nginx/html/index.html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./logo.svg
        target: /usr/share/nginx/html/logo.svg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./apple-touch-icon.png
        target: /usr/share/nginx/html/apple-touch-icon.png
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./velyric.vcf
        target: /usr/share/nginx/html/velyric.vcf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
